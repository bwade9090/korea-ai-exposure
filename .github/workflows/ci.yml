name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Set up the pinned environment
        run: make setup PYTHON=python
      - name: Lint, format check, offline tests
        run: make check

  # The owner develops on Windows; run the same commands there, without make.
  check-windows:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Set up the pinned environment
        run: |
          python -m venv .venv
          .venv\Scripts\python -m pip install --require-hashes -r requirements.txt
          .venv\Scripts\python -m pip install --no-deps --no-build-isolation -e .
      - name: Lint, format check, offline tests
        run: |
          .venv\Scripts\python -m ruff check .
          .venv\Scripts\python -m ruff format --check .
          .venv\Scripts\python -m pytest
